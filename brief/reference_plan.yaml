transcription_notes:
  ground_problems:
  - 'The ground floor GFA (usable plus circulation, taken from internal face to face rectangles) is 297.02
    m2. That is 18.30 m2 (5.8 percent) below the 315.32 m2 on A-03-001, outside the 5 percent tolerance.
    Nothing on the sheet is mis-transcribed. The gap comes from the measuring basis: the sheet''s room
    strings are internal, while the DDA area most likely includes partitions or is measured to centrelines.
    The method cannot be read from A-07-001.'
  - Usable area is 223.73 m2 against 257.46 (-33.73). Circulation is 73.30 m2 against 57.84 (+15.46).
    The foyer, stair, stair hall, service lobby, service passage and service steps add up to 58.23 m2,
    which is within 0.39 of the sheet's figure. So the sheet probably counts neither the main entrance
    porch (11.20) nor the lift (3.87) as circulation.
  - The carport is 77.35 m2 against 83.04. The rectangle is clipped at x 0.000, so its width is 8.86 and
    not the 8.938 drawn at the skewed back wall.
  ground_notes:
  - 'Check script: C:/Users/AIMANS~1/AppData/Local/Temp/claude/C--Projects-Villa-Jebel-Ali-Hills-Dubai/2ce93692-652f-4094-82a2-49b2017dce6c/scratchpad/gfcheck/check.py,
    run with the project venv and shapely. Of 30 rectangles, no pair overlaps by more than 0.01 m2, and
    all lie inside x 0 to 26.909 and y 0 to 21.296.'
  - 'Dimension check: every room with a sheet string agrees within 0.01 m, except the carport width (8.86
    against 8938, -0.078 m, from the deliberate clip at x 0). Office toilet 1.890 x 3.698, guest toilet
    2.390 x 2.997 and store 2.690 x 1.797 are all within 0.01. The garden room is 26.661 - 9.461 = 17.200,
    and the prep kitchen L is 17.07 m2.'
  - 'No coordinates were changed. Positions were re-checked on hi_p10.png and crops p10_bl, p10_tl and
    p10_br, against grid scales of about 66.7 px/m on the crops. The arrangement matches the sheet: carport
    at the front left. Behind it, going rearward, the drivers room and toilet, then the maid''s toilet
    and wash, then the maid''s room and powder room, then the utility and store, then the prep kitchen
    at the rear left. The service lobby, lift and stair hall sit centre left with the stair along grid
    5. The office toilet and office/study are at the front centre, then the main entrance porch, then
    the guest bedroom with dress and toilet at the front right. The lawn court is behind the guest block.
    The double height foyer is in the middle. The 17.2 x 6.0 garden room runs across the rear (island,
    family sitting, dining, formal lounge).'
  - 'GFA is 297.02 against 315.32, a gap of -5.80 percent, so ok is false. About 2.7 m2 of open floor
    is drawn but not in any rectangle: the band on grid 5 between the foyer and the garden room (6.9 x
    0.198 = 1.37), the band between the stair and the island kitchen (4.10 x 0.20 = 0.83), and the landing
    strip between the lift''s outer face and the foyer (about 0.25 x 2.06 = 0.51). Adding it would give
    about 299.7 (-4.95 percent), but none of it has a room string, so it was not added. Most of the remaining
    gap is internal partitions, if the DDA measures to centrelines or gross.'
  - The carport would be 78.05 m2 if the drawn 8.938 back width were kept instead of clipping at x 0.
    The sheet's 83.04 is about 8.938 x 9.29.
  - The 'other service area' of 6.90 m2 on A-03-001 matches both the stair hall (6.86) and the stair (6.89),
    so which space it means cannot be told from this sheet.
  - 'Not readable on A-07-001: how the lawn court is entered, whether any rear or east glazing slides,
    what the line at x 26.21 is, and the FFL of the foyer, garden room and lawn.'
  first_problems:
  - 'GFA rule fails on the net basis only. The rectangles are clear internal dimensions, so usable plus
    circulation is 283.98 m2. That is 10.69 percent below the sheet''s 317.96, outside the 5 percent band.
    This is a difference in measuring basis, not a coordinate error: the gross outline taken at outer
    wall faces (ff_gross.py) is 340.85 m2, and 320.97 m2 after taking out the foyer void, which is 0.95
    percent off 317.96. Every room matches its dimension strings within 0.05 m (bedroom_1_dress is the
    one exception, see below), so the rectangles cannot be enlarged without departing from the drawing.'
