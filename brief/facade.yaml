# facade.yaml: the facade of the redesign (D-060, S1: A), white minimalist
# after the owner's images of 2026-10-23: clean white render volumes, flat
# roofs, a charcoal stone box around the double height entrance, timber
# soffits under deep eaves and canopies, vertical timber fins on the hot
# windows, large glass in slim dark frames, linear LED lines.
# Single source of truth for the facade elements. src/model/facade.py turns it
# into boxes; the facade build puts the same boxes in the IFC. Never hard-code
# facade geometry in scripts.
#
# Coordinates: the plot building grid of brief/massing.yaml, metres.
#   u from the road (WNW, house front u 4.00) to the garden (ESE, back u 19.00)
#   v from the SSW neighbour (house v 9.90) to the NNE neighbour (v 30.40)
#   z up from the ground floor finish (0.00); first floor 5.00, main roof 9.00,
#   roof parapet top 10.20 (brief/massing.yaml, D-030, S6: B).
#
# Materials are visual concept finishes, not a specification. The earlier
# facade (warm stone, beige render, D-048 and D-051) is in Git history.
#
# CONCEPT DESIGN, NOT FOR CONSTRUCTION.

meta:
  stamp: "CONCEPT DESIGN, NOT FOR CONSTRUCTION"
  status: "First design of the redesign (D-060), for the owner's review."

materials:
  render:  {label: "White render", colour: "#f2f1ec"}
  stone:   {label: "Charcoal stone cladding", colour: "#3a3a3c"}
  timber:  {label: "Timber, soffits, fins and screens", colour: "#9e7045"}
  glass:   {label: "Glass in slim dark frames", colour: "#56656f"}
  frame:   {label: "Dark window frames", colour: "#2e2e2e"}
  led:     {label: "Linear LED line, warm white", colour: "#ffb84d"}

# Named boxes: u, v, z ranges. kind is what the IFC build makes of it.
elements:
  # 1. The entrance: a charcoal stone box around the double height foyer's
  #    road face, the pivot door G01 (1.50 x 3.00 m, glass above it to the
  #    first floor ceiling) in the slot between its legs, a slim white canopy
  #    with a timber soffit over the door. The legs stand inside the setback
  #    line (u 3.00); the head stops at the parapet top, so nothing is added
  #    to the height (DDA FAQ Q29, OI-13).
  - {name: "Entrance stone box, south leg", material: stone, kind: cladding,
     u: [3.70, 4.00], v: [14.90, 16.70], z: [-0.15, 10.20]}
  - {name: "Entrance stone box, north leg", material: stone, kind: cladding,
     u: [3.70, 4.00], v: [18.40, 20.20], z: [-0.15, 10.20]}
  - {name: "Entrance stone box, head", material: stone, kind: cladding,
     u: [3.70, 4.00], v: [16.70, 18.40], z: [8.70, 10.20]}
  - {name: "Entrance stone box, south return", material: stone, kind: cladding,
     u: [4.00, 4.30], v: [14.60, 14.90], z: [-0.15, 10.20]}
  - {name: "Entrance stone box, north return", material: stone, kind: cladding,
     u: [4.00, 4.30], v: [20.20, 20.50], z: [-0.15, 10.20]}
  - {name: "Entrance canopy", material: render, kind: canopy,
     u: [3.05, 3.70], v: [16.40, 18.70], z: [3.30, 3.55]}
  - {name: "Entrance canopy, timber soffit", material: timber, kind: soffit,
     u: [3.05, 3.70], v: [16.40, 18.70], z: [3.24, 3.30]}

  # 2. Garden side (ESE): deep white eaves with timber soffits at the roof and
  #    a canopy over the ground floor glass, the shading the brief asks for on
  #    the glazed faces. The master terrace (u 19.00 to 21.00) is under the
  #    main roof; the eave carries on past it as a lip.
  - {name: "East eave, roof, south", material: render, kind: canopy,
     u: [19.00, 20.60], v: [9.90, 15.10], z: [8.70, 9.00]}
  - {name: "East eave, roof, south, timber soffit", material: timber, kind: soffit,
     u: [19.00, 20.60], v: [9.90, 15.10], z: [8.64, 8.70]}
  - {name: "East eave, roof, north", material: render, kind: canopy,
     u: [19.00, 20.60], v: [20.00, 30.40], z: [8.70, 9.00]}
  - {name: "East eave, roof, north, timber soffit", material: timber, kind: soffit,
     u: [19.00, 20.60], v: [20.00, 30.40], z: [8.64, 8.70]}
  - {name: "East eave, roof, over the terrace", material: render, kind: canopy,
     u: [21.25, 21.85], v: [15.10, 20.00], z: [8.70, 9.00]}
  - {name: "East eave, terrace, timber soffit", material: timber, kind: soffit,
     u: [19.00, 21.85], v: [15.10, 20.00], z: [8.64, 8.70]}
  - {name: "East canopy, ground floor, kitchen", material: render, kind: canopy,
     u: [19.00, 20.60], v: [9.90, 15.10], z: [4.70, 5.00]}
  - {name: "East canopy, ground floor, kitchen, timber soffit", material: timber, kind: soffit,
     u: [19.00, 20.60], v: [9.90, 15.10], z: [4.64, 4.70]}
  - {name: "East canopy, ground floor, living", material: render, kind: canopy,
     u: [19.00, 20.60], v: [23.30, 30.40], z: [4.70, 5.00]}
  - {name: "East canopy, ground floor, living, timber soffit", material: timber, kind: soffit,
     u: [19.00, 20.60], v: [23.30, 30.40], z: [4.64, 4.70]}

  # 3. South (SSW) face, hot: an eave over the master bathroom's wall.
  - {name: "South eave, roof", material: render, kind: canopy,
     u: [13.55, 19.00], v: [8.40, 9.90], z: [8.70, 9.00]}
  - {name: "South eave, roof, timber soffit", material: timber, kind: soffit,
     u: [13.55, 19.00], v: [8.40, 9.90], z: [8.64, 8.70]}

  # 4. The carport (open, two cars): its roof is built with the plan; a
  #    timber soffit under it and a timber slat screen on the road edge,
  #    as in the owner's images.
  - {name: "Carport, timber soffit", material: timber, kind: soffit,
     u: [4.05, 10.45], v: [3.95, 9.85], z: [2.94, 3.00]}
  - {name: "Carport, timber slat screen", material: timber, kind: fin,
     u: [4.05, 4.15], v: [3.95, 5.60], z: [-0.30, 2.94]}

# 5. Windows on the hot faces (the IFC names them "hot": the road WNW face and
#    the south SSW face). Each gets a slim white surround so the glass sits in
#    a reveal, and the larger ones get vertical timber fins against the low
#    west and south sun.
hot_windows:
  surround_material: render
  surround_depth_m: 0.35
  surround_border_m: 0.12
  fins_min_width_m: 1.20
  fins_on_faces: [W, S]
  fin_material: timber
  fin_spacing_m: 0.30
  fin_thickness_m: 0.05
  fin_depth_m: 0.30

# 6. Linear LED lines: polylines of (u, v, z) points.
led:
  - name: "Entrance slot, south edge"
    points: [[3.70, 16.70, -0.15], [3.70, 16.70, 8.64]]
  - name: "Entrance slot, north edge"
    points: [[3.70, 18.40, -0.15], [3.70, 18.40, 8.64]]
  - name: "East eave edge, south"
    points: [[20.60, 9.90, 8.70], [20.60, 15.10, 8.70]]
  - name: "East eave edge, north"
    points: [[20.60, 20.00, 8.70], [20.60, 30.40, 8.70]]
  - name: "Carport fascia"
    points: [[4.00, 3.90, 3.30], [10.50, 3.90, 3.30]]

cuts: []
