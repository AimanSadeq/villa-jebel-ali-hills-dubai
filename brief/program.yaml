  - key: landscape
    name: "Landscape and Softscape"
    notes: "Trees, palms, lawn, planting beds, hardscape paving, driveway."
  - key: boundary_walls
    name: "Boundary Walls and Gates"
    notes: "D-011 wall approved by the owner (G3), TO VERIFY with Meraas (OI-14); car gate into the carport and a pedestrian gate on the portal line (G4, D-055)."
