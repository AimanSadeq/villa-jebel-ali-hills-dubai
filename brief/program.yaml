# program.yaml: Single source of truth for the room program.
# Source: CLAUDE.md section 4. Scripts read this file.
# Never hard-code room sizes in scripts.
#
# Areas are NET and indicative. Gross floor area is derived by applying
# targets.net_to_gross_factor from site.yaml. See src/analysis/gfa_check.py.
#
# gfa field values:
#   counts    the area counts toward the DDA GFA limit
#   unverified  whether it counts is not confirmed. TO VERIFY. See docs/open-items.md
#   excluded  does not count (voids only, per CLAUDE.md section 3)

meta:
  stamp: "CONCEPT DESIGN, NOT FOR CONSTRUCTION"
  source: "CLAUDE.md section 4"
  area_units: m2

ground:
  - key: entrance_foyer
    name: "Entrance Foyer"
    target_m2: 19
    brief_target_m2: 20
    trimmed: route_b
    trim_note: >
      Trimmed from the CLAUDE.md section 4 target of 20 m2 to 19 m2. Owner
      approved trim route B, 2026-10-01. Still double height.
    gfa: counts
    double_height: true
    notes: "Double height."
  - key: living
    name: "Living Room"
    target_m2: 45
    gfa: counts
    double_height: true
    notes: "Double height. Connects to garden and pool."
  - key: majlis
    name: "Majlis (Salon)"
    target_m2: 35
    gfa: counts
    notes: >
      Formal reception, close to entrance, with its own guest powder room.
      Owner confirmed 2026-10-01 that majlis and salon are the same room.
  - key: guest_powder
    name: "Guest Powder Room"
    target_m2: 4
    gfa: counts
    notes: "Next to the majlis."
  - key: guest_bedroom
    name: "Guest Bedroom, En-suite"
    target_m2: 32
    gfa: counts
    notes: "Only bedroom on the ground floor."
  - key: dining
    name: "Dining"
    target_m2: 22
    gfa: counts
    notes: >
      Owner confirmed 2026-10-01 that dining is on the ground floor.
      Size still indicative. Placement to be proposed at checkpoint 2.
  - key: show_kitchen
    name: "Show Kitchen"
    target_m2: 25
    gfa: counts
    notes: "Open to dining or living."
  - key: arabic_kitchen
    name: "Arabic (Dirty) Kitchen"
    target_m2: 15
    gfa: counts
    notes: "Behind the show kitchen, service access."
  - key: pantry
    name: "Pantry / Storage"
    target_m2: 5
    brief_target_m2: 6
    trimmed: route_b
    trim_note: >
      Trimmed from the CLAUDE.md section 4 target of 6 m2 to 5 m2. Owner
      approved trim route B, 2026-10-01.
    gfa: counts
  - key: laundry
    name: "Laundry"
    target_m2: 7
    brief_target_m2: 8
    trimmed: route_b
    trim_note: >
      Trimmed from the CLAUDE.md section 4 target of 8 m2 to 7 m2. Owner
      approved trim route B, 2026-10-01.
    gfa: counts
    notes: "Near the staff and service zone."
  - key: home_office
    name: "Home Office"
    target_m2: 14
    gfa: counts
    notes: "Quiet, near entrance."
  - key: maids_room
    name: "Maid's Room with Bathroom"
    target_m2: 11
    brief_target_m2: 12
    trimmed: route_b
    trim_note: >
      Trimmed from the CLAUDE.md section 4 target of 12 m2 to 11 m2. Owner
      approved trim route B, 2026-10-01.
    gfa: counts
    notes: "In the staff zone with a separate entrance."
  - key: outdoor_bathroom
    name: "Outdoor Bathroom, WC and Shower"
    target_m2: 4.5
    gfa: counts
    added_by_owner: "2026-10-02"
    notes: >
      Owner decision 2026-10-02, D-028. Its own external door and no internal
      connection to the villa. Opens onto the courtyard at the north end of the
      pool, beside the garage, so it serves swimmers and garden use as well as
      a non-resident driver or outdoor staff. Size is a Claude assumption for a
      WC and shower, flagged for owner review.
  - key: plant_room
    name: "MEP Plant Room"
    target_m2: 7
    brief_target_m2: 8
    trimmed: route_b
    trim_note: >
      Trimmed from the CLAUDE.md section 4 target of 8 m2 to 7 m2. Owner
      approved trim route B, 2026-10-01.
    gfa: counts
    notes: "Water tanks, filtration, controls, low-current rack."
  - key: stair_lift_ground
    name: "Staircase + Home Elevator"
    target_m2: 18
    brief_target_m2: 20
    trimmed: route_b
    trim_note: >
      Trimmed from the CLAUDE.md section 4 target of 20 m2 to 18 m2. Owner
      approved trim route B, 2026-10-01. Tightened with the first floor
      core.
    gfa: counts
    notes: >
      Elevator serves ground and first. The roof stop was removed by owner
      decision on 2026-10-01.
  - key: garage
    name: "Garage, Enclosed, 2 Cars"
    target_m2: 38
    brief_target_m2: 55
    cars: 2
    gfa: counts
    track_separately: true
    notes: >
      Owner decision 2026-10-02: two cars, not three. CLAUDE.md section 4 asked
      for an enclosed three car garage at 55 m2.

      Sized from the DDA bay standard rather than scaled down. DDA FAQs
      Building Q5 gives a standard bay as 2.5 x 5.5 m. The 55 m2 three car
      figure works out as a footprint about 8.15 x 6.75 m, holding three bays
      at 2.55 m with 6.25 m of depth. Removing one bay takes 2.55 m off the
      width, giving about 5.60 x 6.75 m, so 38 m2.

      The DDA plot details require a minimum of one parking space, so two
      remains compliant.

      Counted toward GFA by the owner decision of 2026-10-01. See D-018.
    trimmed: owner_2_cars
    trim_note: >
      Saves 17 m2 of gross floor area directly, since a garage footprint is
      already a gross figure and no net to gross factor applies to it.

first:
  - key: master_suite
    name: "Master Suite"
    target_min_m2: 68
    brief_target_min_m2: 70
    trimmed: trim_t2
    trim_note: >
      Trimmed by owner decision 2026-10-02, D-027, to bring the measured plan inside the GFA cap. Cut upstairs because in massing option C a ground floor cut in the two storey wing only turns into padding under the bedrooms.
    target_max_m2: 80
    gfa: counts
    notes: >
      Excludes balcony. Must be 2.2 to 2.5 times the other bedrooms. Contains
      bedroom, private sitting area, his and hers walk-in wardrobes, large
      bathroom with bathtub and separate shower, coffee / kitchenette station,
      private balcony. The balcony is a terrace on the kitchen roof, D-035; see
      interiors.master_suite. Best upstairs orientation, ideally toward the east
      landscape plot if the sun study supports it.
  - key: bedroom_2
    name: "Bedroom 2, En-suite"
    target_min_m2: 30
    target_max_m2: 35
    gfa: counts
  - key: bedroom_3
    name: "Bedroom 3, En-suite"
    target_min_m2: 30
    target_max_m2: 35
    gfa: counts
  - key: bedroom_4
    name: "Bedroom 4, En-suite"
    target_min_m2: 30
    target_max_m2: 35
    gfa: counts
  - key: family_living
    name: "Family Living Room"
    target_m2: 33
    brief_target_m2: 35
    trimmed: trim_t2
    trim_note: >
      Trimmed by owner decision 2026-10-02, D-027, to bring the measured plan inside the GFA cap. Cut upstairs because in massing option C a ground floor cut in the two storey wing only turns into padding under the bedrooms.
    gfa: counts
    notes: "Acoustically separated from the master suite."
  - key: linen_storage
    name: "Linen and General Storage"
    target_m2: 6
    gfa: counts
  - key: stair_lift_first
    name: "Staircase + Home Elevator"
    target_m2: 15
    brief_target_m2: 20
    trimmed: route_b
    trim_note: >
      Trimmed from the CLAUDE.md section 4 target of 20 m2 to 15 m2. Owner
      approved trim route B, 2026-10-01. Now the top landing. The roof
      stop was removed, so there is no further flight to accommodate.
    gfa: counts
    notes: >
      Not itemised in CLAUDE.md section 4 but required: the stair and elevator
      must land on the first floor. Added by Claude, flagged for owner review.
      Now the top landing, since the roof stop was removed on 2026-10-01.
    added_by_claude: true

# Roof. Owner decision 2026-10-01: no roof terrace and no roof enclosure.
#
# This removes the roof stair and elevator enclosure that CLAUDE.md section 4
# asked for, and with it the risk flagged in OI-05 that DDA might count a roof
# enclosure as an additional floor and breach the G+1 cap outright.
#
# Consequences carried forward:
#  - The elevator now serves ground and first only, not three levels.
#  - The flat roof still exists and still needs a 1.20 m parapet, DDA FAQ Q34.
#  - The VRF outdoor units still need a home. They can sit on the flat roof
#    behind a low screen, which needs no enclosure and adds no floor, or at
#    ground level in the service zone. Decided in Phase 5. See OI-17.
roof: []

# Room interiors, drawn in Phase 3 by owner decision 2026-10-02 (D-034, D-035).
# src/model/interiors.py plans them from these figures, and both the IFC model
# and the floor plans read that plan. Sizes are Claude proposals for owner
# review, not regulatory values. Room areas above include their interiors.
interiors:
  partition_m: 0.10            # internal subdivision, indicative
  ensuite:
    decision: "D-034"
    rooms: [guest_bedroom, bedroom_2, bedroom_3, bedroom_4]
    layout: >
      Owner choice 2026-10-02: bathroom and built-in wardrobe beside the door,
      forming an entry lobby, so the bedroom keeps the facade and its windows.
      The bathroom goes in the corner away from the facade, back to back with
      the next en-suite where possible.
    bathroom:
      width_m: 2.40            # along the door wall
      depth_m: 2.40
      fittings: [walk-in shower, WC, basin]
      ventilation: "Internal, mechanical extract. Rate TO VERIFY, OI-25."
    entry_m: 1.00              # clear entry beside the bathroom, holds the door
    wardrobe:
      depth_m: 0.65
      min_length_m: 1.80
      max_length_m: 3.00
      height_m: 2.40
    bedroom_min_m2: 18.0       # left for the bed area, wardrobe included
  staff_ensuite:
    decision: "D-034"
    rooms: [maids_room]
    door_from: laundry         # the maid's internal door, see ROOM_LINKS
    layout: >
      CLAUDE.md section 4 asks for a maid's room with bathroom. A compact
      shower room across the end of the room away from its door, beside the
      outdoor bathroom so the two share drainage. Claude proposal, for review.
    bathroom:
      width_m: 1.20            # across the full depth of the room
      fittings: [shower, WC, basin]
    bedroom_min_m2: 7.0
  master_suite:
    decision: "D-035"
    layout: >
      Service zone on the road side (bathroom, his and hers walk-in wardrobes),
      reached along a dressing gallery from the landing door. Bedroom and
      sitting area on the terrace side, with the coffee station by the terrace.
    service_zone_width_m: 5.00
    gallery_depth_m: 1.40
    bathroom:
      min_m2: 12.0
      fittings: [bathtub, separate shower, double basin, WC]
    walk_in_wardrobes:
      - {key: wir_hers, name: "Walk-in Wardrobe, Hers", target_m2: 5.0}
      - {key: wir_his, name: "Walk-in Wardrobe, His", target_m2: 5.0}
    coffee_station: {length_m: 1.80, depth_m: 0.60, height_m: 0.90}
    terrace:
      on: "roof of the single storey kitchen and dining block"
      door_width_m: 3.00       # glazed sliding door from the master
      door_height_m: 2.40
      gfa: excluded            # DDA FAQs Building Q25: balconies excluded from GFA, included in BUA

# Rooms removed from the CLAUDE.md section 4 program, kept on record so the
# removal is visible and reversible rather than silent.
removed:
  - key: drivers_room
    name: "Driver's Room with Bathroom"
    brief_target_m2: 12
    removed_on: "2026-10-02"
    decision: "D-028"
    reason: >
      Owner decision: no driver's room. Replaced by an outdoor bathroom with
      its own external door.
  - key: sunroom
    name: "Sunroom"
    brief_target_m2: 20
    removed_on: "2026-10-02"
    decision: "D-024, trim package 2"
    reason: >
      Owner chose trim package 2 to make plan 2 fit at DDA's 1.80 m corridor
      width (FAQ Q12). Of the four costed packages it was the only one that
      left every other room at its brief size. The courtyard in massing option
      C, and the glazed double height living room facing it, already give the
      house its garden room.

# Double-height voids. Per CLAUDE.md section 3 these do not add upper-floor
# area. Listed so they appear in reports and are never double counted.
voids:
  - key: void_over_foyer
    name: "Void over Entrance Foyer"
    over: entrance_foyer
    target_m2: 20
    gfa: excluded
  - key: void_over_living
    name: "Void over Living Room"
    over: living
    target_m2: 45
    gfa: excluded

# Outdoor scope. Not GFA. Sized and positioned in Phase 1 and Phase 4.
outdoor:
  - key: pool
    name: "Swimming Pool"
    size_m: [10, 4]
    target_m2: 40
    notes: "With deck. Position NOT decided. Test east and south/southwest in Phase 1."
  - key: bbq_pergola
    name: "BBQ Area with Pergola"
    notes: "By the pool."
  - key: landscape
    name: "Landscape and Softscape"
    notes: "Trees, palms, lawn, planting beds, hardscape paving, driveway."
  - key: boundary_walls
    name: "Boundary Walls and Gates"
    notes: "Design to be proposed at checkpoint 1."
