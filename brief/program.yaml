# Ancillary spaces that the owner's reference villa draws as rooms of their
# own (D-040, 2026-10-02). They count toward GFA and are placed with the room
# they serve. Sizes are the reference's internal dimensions.
ancillary:
  # Ground floor, decided (D-038 to D-043). Internal sizes from the reference.
  - {floor: ground, key: guest_dress, name: "Guest Bedroom, Dress", serves: guest_bedroom, target_m2: 6.0, gfa: counts}
  - {floor: ground, key: guest_toilet, name: "Guest Bedroom, Toilet", serves: guest_bedroom, target_m2: 7.2, gfa: counts}
  - {floor: ground, key: office_toilet, name: "Office, Toilet", serves: home_office, target_m2: 7.0, gfa: counts}
  - {floor: ground, key: maids_toilet, name: "Maid's Room, Toilet", serves: maids_room, target_m2: 4.2, gfa: counts}
  - {floor: ground, key: wash, name: "Wash", serves: guest_powder, target_m2: 4.4, gfa: counts, notes: "The powder room's basin room, entered from the stair hall."}
  - {floor: ground, key: lift, name: "Home Lift", serves: stair_lift_ground, target_m2: 3.9, gfa: counts}
  - {floor: ground, key: main_entrance, name: "Main Entrance Porch", serves: entrance_foyer, target_m2: 11.2, gfa: unverified, notes: "Open, recessed, double height porch. Designed outside GFA with the carport (D-039), TO VERIFY."}
  - {floor: ground, key: arabic_kitchen_bay, name: "Arabic Kitchen, front bay", serves: arabic_kitchen, target_m2: 2.2, gfa: counts}
  - {floor: ground, key: laundry_bay, name: "Laundry, bay", serves: laundry, target_m2: 1.9, gfa: counts}
  # First floor PLACEHOLDER from the reference, until the owner decides that floor.
  - {floor: first, key: master_dress, name: "Master Dress", serves: master_suite, target_m2: 18.0, gfa: counts, placeholder: true}
  - {floor: first, key: master_toilet, name: "Master Bathroom", serves: master_dress, target_m2: 16.0, gfa: counts, placeholder: true}
  - {floor: first, key: bedroom_2_dress, name: "Bedroom 2, Dress", serves: bedroom_2, target_m2: 7.3, gfa: counts, placeholder: true}
  - {floor: first, key: bedroom_2_toilet, name: "Bedroom 2, Bathroom", serves: bedroom_2_dress, target_m2: 7.5, gfa: counts, placeholder: true}
  - {floor: first, key: bedroom_3_dress, name: "Bedroom 3, Dress", serves: bedroom_3, target_m2: 6.0, gfa: counts, placeholder: true}
  - {floor: first, key: bedroom_3_toilet, name: "Bedroom 3, Bathroom", serves: bedroom_3_dress, target_m2: 7.2, gfa: counts, placeholder: true}
  - {floor: first, key: bedroom_4_dress, name: "Bedroom 4, Dress", serves: bedroom_4, target_m2: 6.0, gfa: counts, placeholder: true}
  - {floor: first, key: bedroom_4_toilet, name: "Bedroom 4, Bathroom", serves: bedroom_4_dress, target_m2: 7.2, gfa: counts, placeholder: true}
  - {floor: first, key: lift_first, name: "Home Lift, first floor", serves: stair_lift_first, target_m2: 3.9, gfa: counts, placeholder: true}

first:
  - key: master_suite
    name: "Master Suite"
    target_min_m2: 68
    brief_target_min_m2: 70
    trimmed: trim_t2
    trim_note: >
      Trimmed by owner decision 2026-10-02, D-027, to bring the measured plan inside the GFA cap. Cut upstairs because in massing option C a ground floor cut in the two storey wing only turns into padding under the bedrooms.
    target_max_m2: 80
    gfa: counts
    notes: >
      Excludes balcony. Must be 2.2 to 2.5 times the other bedrooms. Contains
      bedroom, private sitting area, his and hers walk-in wardrobes, large
      bathroom with bathtub and separate shower, coffee / kitchenette station,
      private balcony. The balcony is a terrace on the kitchen roof, D-035; see
      interiors.master_suite. Best upstairs orientation, ideally toward the east
      landscape plot if the sun study supports it.
  - key: bedroom_2
    name: "Bedroom 2, En-suite"
    target_min_m2: 30
    target_max_m2: 35
    gfa: counts
  - key: bedroom_3
    name: "Bedroom 3, En-suite"
    target_min_m2: 30
    target_max_m2: 35
    gfa: counts
  - key: bedroom_4
    name: "Bedroom 4, En-suite"
    target_min_m2: 30
    target_max_m2: 35
    gfa: counts
  - key: family_living
    name: "Family Living Room"
    target_m2: 26.2
    with_gallery_m2: 33.7
    first_floor_answers: >
      Owner answers 12b and FF5, 2026-10-02 (D-046, D-050): above the salon,
      4.99 x 5.25 m, 26.2 m2 (282 sq ft), open to the 1.49 x 5.04 m gallery,
      about 33.7 m2 (363 sq ft) together, clear height 3.55 m, looking over the
      foyer void.
    target_before_first_floor_m2: 33
    brief_target_m2: 35
    trimmed: trim_t2
    trim_note: >
      Trimmed by owner decision 2026-10-02, D-027, to bring the measured plan inside the GFA cap. Cut upstairs because in massing option C a ground floor cut in the two storey wing only turns into padding under the bedrooms.
    gfa: counts
    notes: "Acoustically separated from the master suite."
  - key: stair_lift_first
    name: "Staircase + Home Elevator"
    target_m2: 15
    brief_target_m2: 20
    trimmed: route_b
    trim_note: >
      Trimmed from the CLAUDE.md section 4 target of 20 m2 to 15 m2. Owner
      approved trim route B, 2026-10-01. Now the top landing. The roof
      stop was removed, so there is no further flight to accommodate.
    gfa: counts
    notes: >
      Not itemised in CLAUDE.md section 4 but required: the stair and elevator
      must land on the first floor. Added by Claude, flagged for owner review.
      Now the top landing, since the roof stop was removed on 2026-10-01.
    added_by_claude: true

# Roof. Owner decision 2026-10-01: no roof terrace and no roof enclosure.
#
# This removes the roof stair and elevator enclosure that CLAUDE.md section 4
# asked for, and with it the risk flagged in OI-05 that DDA might count a roof
# enclosure as an additional floor and breach the G+1 cap outright.
#
# Consequences carried forward:
#  - The elevator now serves ground and first only, not three levels.
#  - The flat roof still exists and still needs a 1.20 m parapet, DDA FAQ Q34.
#  - The VRF outdoor units still need a home. They can sit on the flat roof
#    behind a low screen, which needs no enclosure and adds no floor, or at
#    ground level in the service zone. Decided in Phase 5. See OI-17.
roof: []

# Room interiors, drawn in Phase 3 by owner decision 2026-10-02 (D-034, D-035).
# src/model/interiors.py plans them from these figures, and both the IFC model
# and the floor plans read that plan. Sizes are Claude proposals for owner
# review, not regulatory values. Room areas above include their interiors.
interiors:
  partition_m: 0.10            # internal subdivision, indicative
  ensuite:
    decision: "D-034"
    rooms: [guest_bedroom, bedroom_2, bedroom_3, bedroom_4]
    layout: >
      Owner choice 2026-10-02: bathroom and built-in wardrobe beside the door,
      forming an entry lobby, so the bedroom keeps the facade and its windows.
      The bathroom goes in the corner away from the facade, back to back with
      the next en-suite where possible.
    bathroom:
      width_m: 2.40            # along the door wall
      depth_m: 2.40
      fittings: [walk-in shower, WC, basin]
      ventilation: "Internal, mechanical extract. Rate TO VERIFY, OI-25."
    entry_m: 1.00              # clear entry beside the bathroom, holds the door
    wardrobe:
      depth_m: 0.65
      min_length_m: 1.80
      max_length_m: 3.00
      height_m: 2.40
    bedroom_min_m2: 18.0       # left for the bed area, wardrobe included
  staff_ensuite:
    decision: "D-034"
    rooms: [maids_room]
    door_from: laundry         # the maid's internal door, see ROOM_LINKS
    layout: >
      CLAUDE.md section 4 asks for a maid's room with bathroom. A compact
      shower room across the end of the room away from its door, beside the
      outdoor bathroom so the two share drainage. Claude proposal, for review.
    bathroom:
      width_m: 1.20            # across the full depth of the room
      fittings: [shower, WC, basin]
    bedroom_min_m2: 7.0
  master_suite:
    decision: "D-035"
    layout: >
      Service zone on the road side (bathroom, his and hers walk-in wardrobes),
      reached along a dressing gallery from the landing door. Bedroom and
      sitting area on the terrace side, with the coffee station by the terrace.
    service_zone_width_m: 5.00
    gallery_depth_m: 1.40
    bathroom:
      min_m2: 12.0
      fittings: [bathtub, separate shower, double basin, WC]
    walk_in_wardrobes:
      - {key: wir_hers, name: "Walk-in Wardrobe, Hers", target_m2: 5.0}
      - {key: wir_his, name: "Walk-in Wardrobe, His", target_m2: 5.0}
    coffee_station: {length_m: 1.80, depth_m: 0.60, height_m: 0.90}
    terrace:
      on: "roof of the single storey kitchen and dining block"
      door_width_m: 3.00       # glazed sliding door from the master
      door_height_m: 2.40
      gfa: excluded            # DDA FAQs Building Q25: balconies excluded from GFA, included in BUA

# Rooms removed from the CLAUDE.md section 4 program, kept on record so the
# removal is visible and reversible rather than silent.
removed:
  - key: linen_storage
    name: "Linen and General Storage"
    brief_target_m2: 6
    removed_on: "2026-10-02"
    decision: "D-050"
    reason: >
      Owner answer FF4: no separate linen store; linen goes into the built-in
      wardrobes of the dressing rooms. The reference's store became void over
      the island kitchen by answer 12l.
  - key: family_sitting
    name: "Family Sitting"
    brief_target_m2: null
    removed_on: "2026-10-02"
    decision: "D-046"
    reason: >
      Owner answer 12: the garden room is rearranged; its sitting area becomes
      the double height living room.
  - key: lawn_court
    name: "Internal Lawn Court, open to the sky"
    brief_target_m2: null
    removed_on: "2026-10-02"
    decision: "D-046"
    reason: >
      Owner answer 12: "Remove the lawn, and replace it with salon." Enclosing
      it adds its area to the GFA.
  - key: pantry_first
    name: "First Floor Pantry"
    brief_target_m2: null
    removed_on: "2026-10-02"
    decision: "D-046"
    reason: >
      Owner answer 12l: became void over the island kitchen to bring answer 12
      inside the GFA cap. Its coffee station belongs in the master suite (brief).
  - key: pool
    name: "Swimming Pool"
    brief_target_m2: 40
    size_m: [10, 4]
    removed_on: "2026-10-02"
    decision: "D-041"
    reason: >
      Owner decision 2026-10-02, ground floor answer 8 superseded: "I don't
      need a pool." Not GFA, so no area effect. Pool MEP (CLAUDE.md section 6)
      falls away with it.
  - key: drivers_room
    name: "Driver's Room with Bathroom"
    brief_target_m2: 12
    removed_on: "2026-10-02"
    decision: "D-028"
    reason: >
      Owner decision: no driver's room. Replaced by an outdoor bathroom with
      its own external door.
  - key: sunroom
    name: "Sunroom"
    brief_target_m2: 20
    removed_on: "2026-10-02"
    decision: "D-024, trim package 2"
    reason: >
      Owner chose trim package 2 to make plan 2 fit at DDA's 1.80 m corridor
      width (FAQ Q12). Of the four costed packages it was the only one that
      left every other room at its brief size. The courtyard in massing option
      C, and the glazed double height living room facing it, already give the
      house its garden room.

# Double-height voids. Per CLAUDE.md section 3 these do not add upper-floor
# area. Listed so they appear in reports and are never double counted.
voids:
  - key: void_over_foyer
    name: "Void over Entrance Foyer"
    over: entrance_foyer
    target_m2: 20
    gfa: excluded
  - key: void_over_living
    name: "Void over Living Room and Island Kitchen"
    over: living
    target_m2: 40.8
    gfa: excluded
    notes: "Answers 12 and 12l (D-046): over the living room and most of the island kitchen."

