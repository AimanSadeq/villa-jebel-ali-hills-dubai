# program.yaml: Single source of truth for the room program.
# Redesign of 2026-10-23 (D-060): the owner's handover
# reference/owner/Owner_handover_2026-10-23.md and his answers S1 to S7
# (docs/redesign-decisions.md) replace CLAUDE.md section 4. The earlier
# program is in Git history (brief/program.yaml before D-060) and in
# docs/decisions.md; nothing here is a regulatory value.
#
# Areas are NET room areas as designed in src/model/layout_court.py: clear
# room sizes, walls excluded. The GFA check turns them into a gross estimate
# with targets.net_to_gross_factor from site.yaml; once the plan exists the
# measured figure in brief/layouts.yaml is the binding one (D-025).
#
# gfa field values:
#   counts      the area counts toward the DDA GFA limit
#   unverified  whether it counts is not confirmed. TO VERIFY. See docs/open-items.md
#   excluded    does not count (voids and the open courtyard, CLAUDE.md section 3)

meta:
  stamp: "CONCEPT DESIGN, NOT FOR CONSTRUCTION"
  source: "Owner handover 2026-10-23 (D-060) and answers S1 to S7"
  area_units: m2
  target_enclosed_m2: [450, 500]     # the handover's range, G+1 enclosed, optimise rather than fill
  character: "White minimalist: white volumes, flat roofs, charcoal accents (S1: A)"

ground:
  - key: entrance_foyer
    name: "Entrance Foyer"
    target_m2: 21.9
    gfa: counts
    double_height: true
    notes: "Double height, the floating stair rises into it (handover). Glass wall to the courtyard (S2)."
  - key: courtyard
    name: "Courtyard, open to the sky"
    target_m2: 20.7
    gfa: excluded
    open_to_sky: true
    notes: >
      About 22 m2 with a statement tree, in the middle of the house between the
      foyer and the dining (S2: A). Open to the sky: not floor area. It also
      gives the closed Arabic kitchen a window for light and air (OI-15, TO VERIFY).
  - key: salon
    name: "Salon"
    target_m2: 20.9
    gfa: counts
    notes: "Formal reception off the hall through its own lobby, for privacy (handover). Always the salon, never majlis (D-047, S3)."
  - key: guest_powder
    name: "Guest Powder Room"
    target_m2: 3.1
    gfa: counts
    notes: "Off the salon lobby."
  - key: guest_bedroom
    name: "Guest Bedroom, En-suite"
    target_m2: 19.8
    gfa: counts
    notes: "The only bedroom on the ground floor, entered from the hall through its own lobby (handover). Bathroom beside it, accessible: TO VERIFY with the Dubai Universal Design Code."
  - key: dining
    name: "Dining and Garden Room"
    target_m2: 39.9
    gfa: counts
    notes: "Between the courtyard and the garden, open to the show kitchen, the hall and the family living."
  - key: living
    name: "Family Living"
    target_m2: 33.2
    gfa: counts
    notes: "Garden side, direct shaded door to the private garden (handover)."
  - key: show_kitchen
    name: "Show Kitchen"
    target_m2: 24.0
    gfa: counts
    notes: "Island kitchen open to the dining; door to the BBQ terrace."
  - key: arabic_kitchen
    name: "Arabic (Prep) Kitchen"
    target_m2: 8.8
    gfa: counts
    notes: "Enclosed, behind the show kitchen, from the service corridor. Pantry as tall cupboards along its wall (handover: pantry)."
  - key: laundry
    name: "Laundry"
    target_m2: 6.7
    gfa: counts
  - key: maids_room
    name: "Maid's Room with Bathroom"
    target_m2: 8.3
    gfa: counts
  - key: plant_room
    name: "MEP Plant Room"
    target_m2: 7.0
    gfa: counts
    notes: "Single storey block beside the carport, from the service corridor. Size to confirm in Phase 5."
  - key: lift
    name: "Home Lift"
    target_m2: 3.4
    gfa: counts
    notes: "Shaft 1.60 x 2.15 m, TO VERIFY with the lift supplier (OI-23)."
  - key: garage
    name: "Carport, Open, 2 Cars"
    target_m2: 38.9
    gfa: unverified
    outside_the_house: true
    notes: >
      Open side by side carport for one large SUV and one standard car,
      provisional 6.5 x 6.0 m (handover); exact SUV size to follow. Built as a
      roofed plate outside the house, not a room. Whether DDA counts an open
      carport toward GFA is TO VERIFY (OI-01).

# Rooms that belong to another room: drawn by the plan and counted with it.
ancillary:
  - {key: maids_toilet, name: "Maid's Shower Room", serves: maids_room, target_m2: 4.8, gfa: counts}
  - {key: guest_toilet, name: "Guest Bathroom", serves: guest_bedroom, target_m2: 6.1, gfa: counts}
  - {key: master_dress, name: "Master Walk-in Wardrobe", serves: master_suite, target_m2: 11.6, gfa: counts}
  - {key: master_toilet, name: "Master Bathroom, shower only", serves: master_suite, target_m2: 11.6, gfa: counts}
  - {key: bedroom_2_toilet, name: "Bedroom 2 En-suite", serves: bedroom_2, target_m2: 5.1, gfa: counts}
  - {key: bedroom_3_dress, name: "Bedroom 3 Dressing Room", serves: bedroom_3, target_m2: 5.2, gfa: counts}
  - {key: bedroom_3_toilet, name: "Bedroom 3 En-suite", serves: bedroom_3, target_m2: 5.2, gfa: counts}
  - {key: lift_first, name: "Home Lift, first floor", serves: lift, target_m2: 3.4, gfa: counts}

first:
  - key: master_suite
    name: "Master Bedroom"
    target_m2: 22.8
    gfa: counts
    notes: >
      Over the dining, garden facing, with its covered terrace (handover).
      Walk-in wardrobe and shower bathroom integrated: the wardrobe opens from
      the bedroom and the bathroom from the wardrobe (handover: shower only,
      no bathtub). Window onto the courtyard.
  - key: bedroom_2
    name: "Bedroom 2, En-suite"
    target_m2: 19.8
    gfa: counts
    notes: "Over the guest suite: the first floor is enclosed there (handover acceptance test)."
  - key: bedroom_3
    name: "Bedroom 3, En-suite"
    target_m2: 21.8
    gfa: counts
    notes: "Over the family living, garden facing, through its dressing room."
  - key: family_living
    name: "Family Lounge"
    target_m2: 20.9
    gfa: counts
    notes: "Over the salon, open to the workspace and the gallery bridge over the foyer (handover)."
  - key: workspace
    name: "Workspace"
    target_m2: 6.5
    gfa: counts
    notes: "Flexible workspace in the family lounge, by the road window (S5: A, no ground floor office)."

roof: []

# Interiors: every bathroom and dressing room is drawn as its own room above,
# so the en-suite planner has nothing to add (ensuite.rooms and
# staff_ensuite.rooms are empty). The master block stays for the furniture.
interiors:
  partition_m: 0.10
  ensuite:
    decision: "D-060"
    rooms: []
    bathroom: {width_m: 2.40, depth_m: 2.40, fittings: [walk-in shower, WC, basin],
               ventilation: "Internal bathrooms, mechanical extract. Rate TO VERIFY, OI-25."}
    entry_m: 1.00
    wardrobe: {depth_m: 0.65, min_length_m: 1.80, max_length_m: 3.00, height_m: 2.40}
    bedroom_min_m2: 14.0
  staff_ensuite:
    decision: "D-060"
    rooms: []
    door_from: service_corridor
    bathroom: {width_m: 1.50, fittings: [shower, WC, basin]}
    bedroom_min_m2: 7.0
  master_suite:
    decision: "D-060"
    layout: "Bedroom with the terrace east; walk-in wardrobe and shower bathroom south, over the show kitchen."
    service_zone_width_m: 4.95
    gallery_depth_m: 0.0
    bathroom: {min_m2: 10.0, fittings: [walk-in shower, double basin, WC]}
    walk_in_wardrobes:
      - {key: wir, name: "Walk-in Wardrobe", target_m2: 11.6}
    coffee_station: {length_m: 0.0, depth_m: 0.0, height_m: 0.0}
    terrace:
      on: "covered terrace off the master bedroom, over the dining's garden edge"
      door_width_m: 3.00
      door_height_m: 2.70
      gfa: excluded

# Rooms of the earlier briefs that the redesign does not have, kept on record
# so the change is visible and reversible rather than silent.
removed:
  - {key: bedroom_4, name: "Bedroom 4, En-suite", decision: "D-060", reason: "Handover: exactly three bedrooms upstairs."}
  - {key: linen_storage, name: "Linen and General Storage", decision: "D-050", reason: "FF4, and the handover: no linen room."}
  - {key: home_office, name: "Home Office", decision: "D-060", reason: "S5: A, the workspace is in the family lounge."}
  - {key: office_toilet, name: "Office WC", decision: "D-060", reason: "With the office."}
  - {key: outdoor_bathroom, name: "Outdoor Bathroom", decision: "D-060", reason: "Not in the handover program."}
  - {key: wash, name: "Wash", decision: "D-060", reason: "Not in the handover program."}
  - {key: pantry, name: "Pantry room", decision: "D-060", reason: "Pantry as cupboards in the Arabic kitchen."}
  - {key: drivers_room, name: "Driver's Room with Bathroom", decision: "D-028", reason: "No driver's room, owner 2026-10-01."}
  - {key: sunroom, name: "Sunroom", decision: "D-024", reason: "Trim package 2, owner 2026-10-01."}
  - {key: pool, name: "Swimming Pool", decision: "D-041", reason: "No pool; the handover agrees."}
  - {key: roof_enclosure, name: "Roof stair and elevator enclosure", decision: "D-017", reason: "No roof terrace or enclosure."}

voids:
  - key: void_over_foyer
    name: "Void over the Entrance Foyer"
    over: entrance_foyer
    target_m2: 29.7
    gfa: excluded
    notes: "The foyer and the stair's upper flight, which floats in the void."
  - key: void_over_courtyard
    name: "Void over the Courtyard"
    over: courtyard
    target_m2: 20.7
    gfa: excluded
    notes: "Open to the sky."

# Outdoor scope. Not GFA.
outdoor:
  - key: master_terrace
    name: "Master Terrace, covered"
    notes: "2.0 x 4.6 m off the master bedroom, toward the garden, under the main roof. Outside GFA by DDA FAQ Q25 reading, TO VERIFY (OI-01)."
  - key: bbq_pergola
    name: "BBQ Area with Pergola"
    notes: "By the show kitchen's garden door, south-east corner of the garden (G1 kept)."
  - key: landscape
    name: "Landscape and Softscape"
    notes: "Private garden east of the house, measured from the plan in output/reports; front garden with palms; no vehicle or pedestrian gate (handover)."
  - key: boundary_walls
    name: "Boundary Walls"
    notes: "Walls to the neighbours and a screen to the landscape plot (D-011, TO VERIFY OI-14); the road side is open, with planting (handover: no gates). TO VERIFY with Meraas."
