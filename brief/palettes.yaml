# palettes.yaml: three switchable interior palettes for the walkthrough
# (CLAUDE.md section 5, answer P1). Single source of truth: the swatch sheet
# VJH-SK-018 and the walkthrough read this file.
#
# Each palette sets the same slots so the viewer can switch them room by room:
#   zones: public (foyer, salon, living, dining, family room, gallery, halls,
#          stair), kitchen (island kitchen, Arabic kitchen, pantry), bedrooms
#          (bedrooms, dressing rooms, office), wet (bathrooms, powder rooms),
#          service (maid's room, laundry, plant room, service halls).
#   a swatch: name, colour (hex, for the viewer), pattern (how the sheet and
#          the viewer draw it: plain, stone, marble, wood, terrazzo, concrete,
#          metal), roughness 0 to 1 (viewer material), and texture: the key of
#          the photographic material in assets/manifest.yaml (answer P7, D-056),
#          used when the asset has been fetched; the pattern is the fallback.
#
# They all sit with the facade (D-048, D-051): warm stone, beige render,
# timber, dark slim frames. Colours are visual concept finishes, not a
# specification: products, slip resistance in wet areas and fire ratings are
# for the interior designer and the consultant. Textures in the walkthrough
# will come from free CC0 libraries (for example Poly Haven), each recorded in
# assets/LICENSES.md.
#
# CONCEPT DESIGN, NOT FOR CONSTRUCTION.

meta:
  stamp: "CONCEPT DESIGN, NOT FOR CONSTRUCTION"
  status: "Approved by the owner (P4, D-052); palette 1 back to Sand and Oak by the owner, 2026-10-03 (D-053). Built into the walkthrough; Sand and Oak is the default."
  count: 3

# Feature walls (walls.feature): the TV wall between the living room and the
# dining (answer 12g), both faces, and the salon's long solid wall.
feature_walls:
  - {room: living, side: N}
  - {room: dining, side: S}
  - {room: salon, side: W}

palettes:
  - key: palette_1
    name: "Sand and Oak"
    status: approved
    restored: "Sand and Oak restored by the owner, 2026-10-03, replacing White, Black and Beige (answer P6, D-053)"
    idea: >
      Warm and quiet, the closest to the facade: sand coloured stone floors,
      warm white walls, light oak joinery, brushed brass. Calm, light rooms
      that let the double height spaces and the garden lead.
    flooring:
      public:   {name: "Beige limestone look porcelain, 1200 x 600, honed", colour: "#d9ccb4", pattern: stone, roughness: 0.55, texture: limestone_floor}
      kitchen:  {name: "As the public floor", colour: "#d9ccb4", pattern: stone, roughness: 0.55, texture: limestone_floor}
      bedrooms: {name: "Light oak engineered timber, wide plank", colour: "#c9a77c", pattern: wood, roughness: 0.6, texture: oak_floor}
      wet:      {name: "Beige limestone look porcelain, textured", colour: "#cfc1a6", pattern: stone, roughness: 0.8, texture: limestone_floor}
      service:  {name: "Light beige porcelain, matt", colour: "#d6cfc2", pattern: plain, roughness: 0.7, texture: limestone_floor}
    walls:
      main:     {name: "Warm white paint, matt", colour: "#f2ece1", pattern: plain, roughness: 0.9, texture: plaster_white}
      feature:  {name: "Travertine slab, TV wall and salon wall", colour: "#d8c3a0", pattern: stone, roughness: 0.6, texture: travertine}
      wet:      {name: "Beige stone look porcelain, large format", colour: "#e0d4bf", pattern: stone, roughness: 0.5, texture: limestone_floor}
      ceiling:  {name: "Warm white paint, flat", colour: "#f6f2ea", pattern: plain, roughness: 0.95, texture: plaster_white}
    accents:
      joinery:  {name: "Light oak veneer", colour: "#c8a272", pattern: wood, roughness: 0.6, texture: oak_floor}
      worktop:  {name: "Cream quartz", colour: "#ece4d4", pattern: plain, roughness: 0.3}
      textile:  {name: "Oatmeal linen and boucle", colour: "#d7cbb5", pattern: plain, roughness: 1.0, texture: fabric}
      highlight: {name: "Terracotta cushions and art", colour: "#b8694a", pattern: plain, roughness: 0.9}
    fixtures:
      metal:    {name: "Brushed brass", colour: "#b08d57", pattern: metal, roughness: 0.35}
      sanitary: {name: "White ceramic", colour: "#f7f7f5", pattern: plain, roughness: 0.15}
      lighting: {name: "Warm white 2700 K, linen shades", colour: "#ffe2b0", pattern: plain, roughness: 1.0, texture: fabric}

