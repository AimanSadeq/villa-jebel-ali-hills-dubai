      kitchen:  {name: "As the public floor", colour: "#cfcdc8", pattern: terrazzo, roughness: 0.4, texture: terrazzo}
      bedrooms: {name: "Smoked oak engineered timber", colour: "#8a7663", pattern: wood, roughness: 0.6, texture: oak_floor}
      wet:      {name: "Mid grey concrete look porcelain, textured", colour: "#a9a7a2", pattern: concrete, roughness: 0.8, texture: concrete_smooth}
      service:  {name: "Grey porcelain, matt", colour: "#c4c2bd", pattern: plain, roughness: 0.7, texture: concrete_smooth}
    walls:
      main:     {name: "Pure white paint, matt", colour: "#f7f7f5", pattern: plain, roughness: 0.9, texture: plaster_white}
      feature:  {name: "Charcoal microcement, TV wall and salon wall", colour: "#4a4947", pattern: concrete, roughness: 0.7, texture: concrete_smooth}
      wet:      {name: "Light grey concrete look porcelain, large format", colour: "#c9c7c2", pattern: concrete, roughness: 0.6, texture: concrete_smooth}
      ceiling:  {name: "Pure white paint, flat", colour: "#fafaf9", pattern: plain, roughness: 0.95, texture: plaster_white}
    accents:
      joinery:  {name: "Smoked oak and charcoal lacquer", colour: "#5a4c40", pattern: wood, roughness: 0.55, texture: walnut}
