# palettes.yaml: three switchable interior palettes for the walkthrough
# (CLAUDE.md section 5, answer P1). Single source of truth: the swatch sheet
# VJH-SK-018 and the walkthrough read this file.
#
# Each palette sets the same slots so the viewer can switch them room by room:
#   zones: public (foyer, salon, living, dining, family room, gallery, halls,
#          stair), kitchen (island kitchen, Arabic kitchen, pantry), bedrooms
#          (bedrooms, dressing rooms, office), wet (bathrooms, powder rooms),
#          service (maid's room, laundry, plant room, service halls).
#   a swatch: name, colour (hex, for the viewer), pattern (how the sheet and
#          the viewer draw it: plain, stone, marble, wood, terrazzo, concrete,
#          metal), roughness 0 to 1 (viewer material).
#
# They all sit with the facade (D-048, D-051): warm stone, beige render,
# timber, dark slim frames. Colours are visual concept finishes, not a
# specification: products, slip resistance in wet areas and fire ratings are
# for the interior designer and the consultant. Textures in the walkthrough
# will come from free CC0 libraries (for example Poly Haven), each recorded in
# assets/LICENSES.md.
#
# CONCEPT DESIGN, NOT FOR CONSTRUCTION.

meta:
  stamp: "CONCEPT DESIGN, NOT FOR CONSTRUCTION"
  status: "Proposed to the owner on VJH-SK-018 Rev B (answers P1, P2 C, P3 C). Not approved."
  count: 3

palettes:
  - key: palette_1
    name: "White, Black and Beige"
    status: proposed
    replaces: "Sand and Oak (answers P2 C and P3 C, 2026-10-03)"
    idea: >
      The owner's direction: white walls and joinery, warm beige floors and
      soft furnishings, black as the sharp accent in a black marble look
      feature wall, black worktops and matt black metal. Clean and bright,
      with the beige keeping it warm next to the stone facade.
    flooring:
      public:   {name: "Warm beige porcelain, 1200 x 1200, matt", colour: "#d8cbb3", pattern: stone, roughness: 0.55}
      kitchen:  {name: "As the public floor", colour: "#d8cbb3", pattern: stone, roughness: 0.55}
      bedrooms: {name: "Pale washed oak engineered timber, beige tone", colour: "#d4c1a1", pattern: wood, roughness: 0.6}
      wet:      {name: "Beige stone look porcelain, textured", colour: "#d2c4aa", pattern: stone, roughness: 0.8}
      service:  {name: "Beige porcelain, matt", colour: "#d6ccbb", pattern: plain, roughness: 0.7}
    walls:
      main:     {name: "Pure white paint, matt", colour: "#f7f6f2", pattern: plain, roughness: 0.9}
      feature:  {name: "Black marble look slab, Nero Marquina type, TV wall and salon wall", colour: "#1f1e1d", pattern: marble, roughness: 0.25}
      wet:      {name: "White porcelain, large format, satin", colour: "#f3f2ee", pattern: plain, roughness: 0.4}
      ceiling:  {name: "Pure white paint, flat", colour: "#fafaf8", pattern: plain, roughness: 0.95}
    accents:
      joinery:  {name: "White matt lacquer, black handles", colour: "#f0eee9", pattern: plain, roughness: 0.6}
      worktop:  {name: "Black sintered stone", colour: "#1e1e1e", pattern: plain, roughness: 0.3}
      textile:  {name: "Beige boucle and linen", colour: "#d9cbb2", pattern: plain, roughness: 1.0}
      highlight: {name: "Black leather and black and white art", colour: "#1c1c1c", pattern: plain, roughness: 0.6}
    fixtures:
      metal:    {name: "Matt black", colour: "#232323", pattern: metal, roughness: 0.5}
      sanitary: {name: "White ceramic", colour: "#f7f7f5", pattern: plain, roughness: 0.15}
      lighting: {name: "Warm white 3000 K, black and opal glass", colour: "#ffecc9", pattern: plain, roughness: 1.0}

