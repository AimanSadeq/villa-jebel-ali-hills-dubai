      service:  {name: "Grey porcelain, matt", colour: "#c4c2bd", pattern: plain, roughness: 0.7}
    walls:
      main:     {name: "Pure white paint, matt", colour: "#f7f7f5", pattern: plain, roughness: 0.9}
      feature:  {name: "Charcoal microcement, TV wall and salon wall", colour: "#4a4947", pattern: concrete, roughness: 0.7}
      wet:      {name: "Light grey concrete look porcelain, large format", colour: "#c9c7c2", pattern: concrete, roughness: 0.6}
      ceiling:  {name: "Pure white paint, flat", colour: "#fafaf9", pattern: plain, roughness: 0.95}
    accents:
      joinery:  {name: "Smoked oak and charcoal lacquer", colour: "#5a4c40", pattern: wood, roughness: 0.55}
      worktop:  {name: "Dark grey sintered stone", colour: "#3f3e3c", pattern: concrete, roughness: 0.35}
      textile:  {name: "Stone grey wool", colour: "#b9b5ad", pattern: plain, roughness: 1.0}
      highlight: {name: "Rust and cognac leather", colour: "#9a5b34", pattern: plain, roughness: 0.6}
    fixtures:
      metal:    {name: "Matt black", colour: "#262626", pattern: metal, roughness: 0.5}
      sanitary: {name: "Matt white ceramic", colour: "#f2f2f0", pattern: plain, roughness: 0.4}
