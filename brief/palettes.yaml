      kitchen:  {name: "As the public floor, honed", colour: "#eae6df", pattern: marble, roughness: 0.4, texture: marble_white}
      bedrooms: {name: "Walnut engineered timber, herringbone", colour: "#7a5236", pattern: wood, roughness: 0.55, texture: walnut}
      wet:      {name: "Grey veined marble look porcelain, honed", colour: "#d9d6d0", pattern: marble, roughness: 0.6, texture: marble_white}
      service:  {name: "Light grey porcelain, matt", colour: "#d3d1cc", pattern: plain, roughness: 0.7, texture: concrete_smooth}
    walls:
      main:     {name: "Greige paint, matt", colour: "#d9d2c6", pattern: plain, roughness: 0.9, texture: paint_greige}
      feature:  {name: "Book matched marble look slab, TV wall and salon wall", colour: "#ebe7e1", pattern: marble, roughness: 0.2, texture: marble_white}
      wet:      {name: "White marble look porcelain, large format", colour: "#f0ede8", pattern: marble, roughness: 0.3, texture: marble_white}
      ceiling:  {name: "Soft white paint, flat", colour: "#f4f2ee", pattern: plain, roughness: 0.95, texture: plaster_white}
    accents:
      joinery:  {name: "Dark walnut veneer", colour: "#5e3d27", pattern: wood, roughness: 0.5, texture: walnut}
      worktop:  {name: "White marble look sintered stone", colour: "#f1eee9", pattern: marble, roughness: 0.25, texture: marble_white}
      textile:  {name: "Ivory velvet and silk", colour: "#e9e1d3", pattern: plain, roughness: 1.0, texture: fabric}
      highlight: {name: "Deep emerald upholstery and art", colour: "#2f5a4c", pattern: plain, roughness: 0.9}
    fixtures:
      metal:    {name: "Champagne bronze", colour: "#a8865e", pattern: metal, roughness: 0.3}
      sanitary: {name: "White ceramic", colour: "#f7f7f5", pattern: plain, roughness: 0.15}
      lighting: {name: "Warm white 3000 K, crystal and glass", colour: "#ffe8c4", pattern: plain, roughness: 1.0}

